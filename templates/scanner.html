<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QRollCall — Scan Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <nav>
    <div class="brand">QRollCall</div>
    <div>
      <a href="/">Register</a>
      <a href="/scanner">Scan Attendance</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <h1>Scan Attendance</h1>
    <p class="subtitle">Point a student's ID QR code at the camera.</p>

    <div class="card">
      <div id="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>

      <div id="scan-result" class="status-message"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
</body>
</html>
